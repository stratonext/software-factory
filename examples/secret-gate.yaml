# yaml-language-server: $schema=https://raw.githubusercontent.com/stratonext/software-factory/main/docs/pipeline-schema.yaml
#
# The third kind of step: a judge. `uses: typesafe` sends the diff as state and the typed
# questions in prompts/secrets.yaml to TypeSafe's System One model (Jev), and routes on the
# answers with the thresholds that file declares - a decision as data, for about $0.0002.
#
# Needs TYPESAFE_API_KEY. Without it - or on an HTTP error, or a rule about a question that
# was not answered - the gate returns `human` and the request parks. The factory never
# guesses a verdict: a service it could not reach is a decision nobody made.
#
# `sf submit --description "..." --pipeline secret-gate`
name: secret-gate
description: >-
  Implement the request, then have a typed judgment decide whether the diff leaked a
  credential before anything is committed. A parked request is one a human has to look at.
  Use it on repos where a committed key is the expensive mistake. Needs TYPESAFE_API_KEY.
version: 1
max_passes: 1
concurrency: 2
start: code

steps:
  code:
    name: Implement it
    uses: claude
    with:
      prompt: prompts/code.md
    output: code.md
    next: scan

  scan:
    name: Any secret in the diff
    uses: typesafe
    with:
      questions: prompts/secrets.yaml   # the questions, the thresholds and the routing
    output: scan.md                     # the answers and the rule that fired, for replay
    # The judge returns the verdict; this decides what each one means here. `human` is not
    # listed because it is never routed - it parks the request for a person either way.
    on: { pass: commit, fail: code }

  commit:
    name: Commit the work
    uses: shell
    with:
      run: "git add -A && git diff --cached --quiet || git commit -m 'sf: implement the request'"
    on: { pass: done }
