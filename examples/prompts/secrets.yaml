# yaml-language-server: $schema=../../docs/pipeline-schema.yaml#/$defs/judge_file
#
# A judge step's questions and routing: the decision as data rather than prose.
# `state:` is shell commands run in the worktree; each one's stdout becomes a named field
# the questions can refer to. Only these fields and the request reach the model.
state:
  diff: "git diff"

questions:
  secret:
    type: noul                    # a probability between 0 and 1
    instructions: >-
      `diff` hardcodes a credential: an API key, a token, a password, a private key or a
      connection string with a password in it. A placeholder, an obvious fixture value or
      a name read from the environment is not one.
  key_file:
    type: noul
    instructions: >-
      `diff` adds a file that should never be committed: a .env, a .pem or .key, a service
      account JSON, or a credentials file of any kind.

# First match wins; the last rule names no question, so it is the default.
# These pin literals rather than named thresholds so the file can be read on its own -
# `above: $secret` would resolve against `typesafe.thresholds` in ~/.sf/config.yaml.
route:
  - { when: secret,   above: 0.5, verdict: human, notes: "possible hardcoded credential" }
  - { when: key_file, above: 0.5, verdict: human, notes: "possible credentials file added" }
  - { verdict: pass }
