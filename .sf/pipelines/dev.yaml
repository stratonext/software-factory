# yaml-language-server: $schema=../../docs/pipeline-schema.yaml
#
# The shortest line there is: one agent, one cheap gate, then a commit.
#
# `uses:` is who performs a step and `with:` is what they are handed. `next:` is an
# unconditional edge; `on:` routes on the verdict. `done` is the implicit terminal stage.
#
# `sf submit --description "..." --pipeline dev`
name: dev
description: >-
  Implement the request with a coding agent, scan the diff for a leaked credential, then
  commit it. No plan, no tests, no review - the only gate is the cheap one, because a
  committed key is the mistake worth paying $0.0002 a run to avoid. Needs TYPESAFE_API_KEY.
version: 1
max_passes: 0          # nothing routes backwards here
concurrency: 2         # requests worked in parallel; one subscription, so keep it modest
start: code

steps:
  code:
    name: code
    uses: claude
    with:
      prompt: prompts/code.md     # a path, relative to this file
    output: code.md
    # gate.md exists only on a rework pass; an input that is not there yet is skipped.
    input: gate.md
    next: gate

  gate:
    name: human-review-required
    uses: typesafe
    with:
      questions: prompts/human-review.yaml
    output: gate.md                      # the numbers and the rule that fired, for replay
    on: { pass: scan, fail: code }     # `human` is never routed - it parks

  scan:
    name: contains-secrets
    uses: typesafe                # a judge: typed questions, routed by the answers
    with:
      questions: prompts/secrets.yaml   # the questions, the thresholds and the routing
    output: scan.md               # the answers and the rule that fired, for replay
    # `human` is never routed - a suspected credential parks the request for a person, and
    # so does anything that stopped this step reaching a decision (no key, HTTP error).
    on: { pass: commit }

  commit:
    name: commit
    uses: shell                   # an ordinary command, run in the request's worktree
    with:
      # `git diff --cached --quiet` exits 0 when nothing is staged, so an agent that
      # already committed leaves this step a no-op instead of a failure.
      run: "git add -A && git diff --cached --quiet || git commit -m 'sf: implement the request'"
    on: { pass: done }
